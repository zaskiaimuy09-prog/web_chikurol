<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waduh! Halaman Hilang di Kelana - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif; /* Memberikan kesan klasik Nusantara */
        }
        body {
            background-color: #fffaf0; /* Warna cream hangat (Kain Mori) */
            color: #3e2723; /* Cokelat gelap kayu/sogan */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            /* Background pola batik mega mendung tipis transparan */
            background-image: radial-gradient(#8d6e63 0.5px, transparent 0.5px), radial-gradient(#8d6e63 0.5px, #fffaf0 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.95;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(62, 39, 35, 0.15);
            border: 3px solid #8d6e63;
            max-width: 550px;
            width: 100%;
        }
        .wayang-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #b97a57;
        }
        h1 {
            font-size: 6rem;
            color: #d84315; /* Warna merah bata marun */
            line-height: 1;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: normal;
            font-style: italic;
        }
        p {
            font-family: 'Segoe UI', sans-serif;
            color: #5d4037;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .btn-kembali {
            display: inline-block;
            background-color: #d84315;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(216, 67, 21, 0.3);
            transition: 0.3s;
        }
        .btn-kembali:hover {
            background-color: #a30000;
            transform: translateY(-2px);
        }
        .ornamen {
            font-size: 24px;
            color: #b97a57;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <!-- Simbol Estetik Nusantara (Bisa diganti aset gambar gunungan/batik) -->
        <div class="wayang-icon">ꩴ</div> 
        <h1>404</h1>
        <h2>Halaman Kesasar di Kelana</h2>
        <div class="ornamen">❖ ─── ❖ ─── ❖</div>
        <p>
            Wah, sepertinya halaman yang Anda cari sedang merantau atau hilang arah di belantara Nusantara. Mari kembali ke jalur yang benar.
        </p>
        <a href="index.html" class="btn-kembali">Kembali ke Rumah (Beranda)</a>
    </div>

</body>
</html>
